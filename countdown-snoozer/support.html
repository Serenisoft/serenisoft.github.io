<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support – Countdown Snoozer</title>
  <style>
    :root { --bg: #faf8fd; --ink: #1c1b1f; --soft: #5f5a66; --accent: #6750a4; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15131a; --ink: #e8e3ef; --soft: #a29aae; --accent: #cdbcf1; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, sans-serif; }
    main { max-width: 68ch; margin: 0 auto; padding: 48px 24px 72px; }
    h1 { font-size: 1.8rem; margin: 0 0 4px; }
    p { margin: 0 0 16px; }
    .meta { color: var(--soft); margin-bottom: 28px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Countdown Snoozer Support</h1>
    <p class="meta">A Serenisoft product, operated by Covision Technology AS</p>
    <p>Need help with Countdown Snoozer? Contact Covision Technology AS at <a href="mailto:countdown@serenisoft.com">countdown@serenisoft.com</a>.</p>
    <p>For information about how the app handles data, read the <a href="privacy-policy.html">Privacy Policy</a>.</p>
  </main>
</body>
</html>
